name: Release CustomItemForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v0.1.1-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and pack release zip
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: python scripts/build_release.py --zip --tag "$RELEASE_TAG"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          LABEL="${RELEASE_TAG#v}"
          ASSET="dist/CustomItemForge-${LABEL}.zip"
          ls -lh "$ASSET"
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber
