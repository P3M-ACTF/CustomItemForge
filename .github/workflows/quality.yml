name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workflow tools
        run: python -m pip install --disable-pip-version-check -r tools/workflow/requirements.txt

      - name: Test workflow helpers
        run: python -m unittest discover -s tools/workflow/tests -v

      - name: Validate source branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: >-
          python tools/workflow/check_branch.py
          --branch "$BRANCH_NAME"
          --protected main
          --pattern '^(feat|fix|docs|refactor|test|chore|perf|ci|build|style|hotfix|revert)/[a-z0-9]+(?:-[a-z0-9]+)*$'
          --pattern '^dependabot/.+$'
          --pattern '^renovate/.+$'

      - name: Validate Pull Request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$PR_TITLE"

      - name: Run repository hooks
        env:
          SKIP: branch-policy
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Install package with dev extras
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run pytest
        run: pytest -q
